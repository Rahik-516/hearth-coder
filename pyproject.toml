[project]
name = "hearth"
version = "0.1.0"
description = "Fully offline AI coding assistant and project agent for local Ollama models"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ollama", "offline", "coding-agent", "rag", "local-llm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]

# Runtime dependencies are floor-pinned here and exactly pinned in uv.lock (docs/tech-stack.md §3.2).
# Adding anything to this list requires an ADR in docs/adr/ (docs/tech-stack.md §1.3).
dependencies = [
  "ollama>=0.4",
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "prompt_toolkit>=3",
  "numpy>=1.26",
  "networkx>=3",
  "watchfiles>=0.21",
  "pathspec>=0.12",
  "platformdirs>=4",
  "tomli-w>=1",
  # Grammar wheels, exact-pinned. The grammar ABI is coupled to the tree-sitter runtime, and
  # a silent bump moves chunk boundaries, invalidating every embedding and every chunker
  # snapshot (docs/tech-stack.md §3.2). Bump deliberately, per scripts/update_tags_queries.md.
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
evals = ["pyyaml>=6"]                                                    # eval DATA only; import lazily
langs-extra = ["tree-sitter-go", "tree-sitter-rust", "tree-sitter-java"] # Phase 2
server = ["fastapi", "uvicorn"]                                          # Phase 3 web UI

[project.scripts]
hearth = "hearth.cli.app:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-socket>=0.7",
  "hypothesis>=6",
  "syrupy>=4",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2",
  "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# --disable-socket is a product requirement, not a convenience: zero egress is the
# top quality attribute and it is verified by tests (docs/tech-stack.md §11.1).
# Do not remove it, and do not add --allow-hosts entries.
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1 -q -m \"not live and not slow\""
asyncio_mode = "auto"
testpaths = ["tests"]
# Fixture repos are *target* repositories for Hearth to index and edit, and they carry
# their own test suites. Collecting them from here fails on import — `billing` is only on
# the path inside the fixture — and would make the plain `pytest` command unusable. The
# task eval runs them deliberately, as a subprocess with the fixture as its cwd.
norecursedirs = ["tests/fixtures/repos"]
markers = [
  "live: requires a running local Ollama with qwen3.5:4b (run with: pytest -m live)",
  "slow: heavy tests (large synthetic indexes, benchmarks) — run deliberately on AC power",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# Fixture repos are indexing/exec targets, not Hearth's own code — some are deliberately
# broken (tests/fixtures/repos/py_small/src/billing/broken_syntax.py exists to exercise
# the parser's error handling) and none of them are held to Hearth's own style.
extend-exclude = ["tests/fixtures/repos"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Only these modules may spawn processes; S602 (shell=True) is never ignored here —
# its single call site carries a justified per-line noqa. See docs/tech-stack.md §12.1.
"src/hearth/safety/sandbox/*_runner.py" = ["S603", "S607"]
"src/hearth/git/runner.py" = ["S603", "S607"]
# `typer.Option(...)` as an argument default is Typer's documented idiom, not the mutable-
# default-argument footgun B008 exists to catch.
"src/hearth/cli/*.py" = ["B008"]
# Matching real pytest/jest/vitest terminal glyphs (×, ✓, ❯, ›) needs the literal characters.
"src/hearth/tools/test_parsers/__init__.py" = ["RUF001", "RUF003"]
# S108 fires on literal "/tmp/..." strings used as classifier/path-policy test fixtures —
# nothing here actually touches a shared temp directory. S603/S607: test fixtures shell
# out to `git` to build throwaway repositories under tmp_path, which is the point.
"tests/**" = ["S101", "S108", "S603", "S607"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hearth.core.*", "hearth.safety.*", "hearth.tools.*", "hearth.llm.*"]
strict = true
