[project]
name = "py-small-fixture"
version = "0.1.0"
description = "Fixture repository: a small billing service"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
